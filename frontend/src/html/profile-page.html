<!-- ============================================================
     PROFILE PAGE — HTML STRUCTURE (update profile form)
     CSS: src/index.css
     JS:  src/js/profilePage.js
     React connector: src/pages/customer/ProfilePage.jsx
     ============================================================ -->

<div class="profile-page">
  <!-- DashboardLayout sidebar loads here (React) -->

  <header class="page-header">
    <h1>My Profile</h1>
  </header>

  <div id="profileAlert" class="alert" hidden></div>

  <form id="profileForm" class="card max-w-xl mx-auto">
    <div class="form-field">
      <label for="username">Username</label>
      <input id="username" name="username" type="text" disabled class="bg-gray-50" />
    </div>

    <div class="form-field">
      <label for="full_name">Full Name *</label>
      <input id="full_name" name="full_name" type="text" required />
    </div>

    <div class="form-field">
      <label for="email">Email *</label>
      <input id="email" name="email" type="email" required />
    </div>

    <div class="form-field">
      <label for="phone">Phone *</label>
      <input id="phone" name="phone" type="tel" required />
    </div>

    <div class="form-field">
      <label for="password">New Password</label>
      <input id="password" name="password" type="password" placeholder="Leave blank to keep current password" />
    </div>

    <div class="form-field">
      <label for="confirmPassword">Confirm Password</label>
      <input id="confirmPassword" name="confirmPassword" type="password" />
    </div>

    <button type="submit" class="save-profile-btn w-full" id="saveProfileBtn">Save Changes</button>
  </form>
</div>
