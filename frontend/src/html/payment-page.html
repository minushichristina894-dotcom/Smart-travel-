<!-- ============================================================
     PAYMENT PAGE — HTML STRUCTURE (Step 4 form)
     CSS: src/index.css
     JS:  src/js/paymentPage.js
     React connector: src/pages/customer/PaymentPage.jsx
     ============================================================ -->

<div class="payment-page">
  <!-- DashboardLayout sidebar loads here (React) -->

  <header class="page-header">
    <h1>Payment</h1>
    <p>Step 4 of 4 — Complete payment for your trip</p>
  </header>

  <div id="paymentError" class="alert alert--error" hidden></div>

  <div id="paymentSuccess" class="card text-center" hidden>
    <h1>Payment Successful</h1>
    <p>Your booking is pending staff confirmation. A confirmation email was sent.</p>
    <a href="/bookings" class="view-my-bookings-btn">View My Bookings</a>
  </div>

  <div id="paymentFormWrap" class="max-w-xl mx-auto">
    <div class="card mb-6 bg-gray-50" id="bookingSummary">
      <h2 id="summaryDestination">Destination Name</h2>
      <p id="summaryActivity" class="text-sm text-gray-500">No activity</p>
      <p id="summaryTotal" class="text-3xl font-bold text-primary-500">Rs. 0</p>
      <p class="text-xs text-gray-400">Demo payment — no real charge (university project)</p>
    </div>

    <form id="paymentForm" class="card space-y-4">
      <div class="form-field">
        <label for="method">Payment Method</label>
        <select id="method" name="method">
          <option value="card">Credit / Debit Card</option>
          <option value="bank">Bank Transfer (Demo)</option>
        </select>
      </div>

      <div class="form-field">
        <label for="card_name">Name on Card *</label>
        <input id="card_name" name="card_name" type="text" placeholder="Nimal Perera" required />
      </div>

      <div class="form-field">
        <label for="card_number">Card Number *</label>
        <input id="card_number" name="card_number" type="text" placeholder="4111111111111111" maxlength="16" required />
      </div>

      <div class="form-row">
        <div class="form-field">
          <label for="expiry">Expiry (MM/YY) *</label>
          <input id="expiry" name="expiry" type="text" placeholder="12/28" required />
        </div>
        <div class="form-field">
          <label for="cvv">CVV *</label>
          <input id="cvv" name="cvv" type="password" maxlength="4" placeholder="123" required />
        </div>
      </div>

      <button type="submit" class="payment-btn w-full" id="payBtn">Pay Now</button>
    </form>
  </div>
</div>
