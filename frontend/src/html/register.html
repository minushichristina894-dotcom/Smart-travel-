     REGISTER PAGE — HTML STRUCTURE
     CSS: src/css/auth.css
     JS:  src/js/registerPage.js
     React connector: src/pages/public/RegisterPage.jsx (small)
     ============================================================ -->

<div class="auth-page">
  <aside class="auth-hero">
    <img src="/register-hero.jpg" alt="Sri Lanka" class="auth-hero__img" />
    <div class="auth-hero__overlay--register"></div>
  </aside>

  <main class="auth-form-panel">
    <div class="auth-form-wrap">
      <header class="auth-header">
        <h1 class="auth-header__title">Create Account</h1>
        <p class="auth-header__sub">Fill in your details to register as a customer</p>
      </header>

      <div class="auth-card">
        <form class="auth-form auth-form--register" id="registerForm">
          <div class="auth-field">
            <label class="auth-label" for="full_name">Full Name<span class="auth-required">*</span></label>
            <input id="full_name" name="full_name" class="auth-input" type="text" />
          </div>
          <div class="auth-field">
            <label class="auth-label" for="username">Username<span class="auth-required">*</span></label>
            <input id="username" name="username" class="auth-input" type="text" />
          </div>
          <div class="auth-field">
            <label class="auth-label" for="email">Email<span class="auth-required">*</span></label>
            <input id="email" name="email" class="auth-input" type="email" />
          </div>
          <div class="auth-field">
            <label class="auth-label" for="phone">Phone Number<span class="auth-required">*</span></label>
            <input id="phone" name="phone" class="auth-input" type="tel" />
          </div>
          <div class="auth-field">
            <label class="auth-label" for="password">Password<span class="auth-required">*</span></label>
            <input id="password" name="password" class="auth-input" type="password" />
          </div>
          <div class="auth-field">
            <label class="auth-label" for="confirmPassword">Confirm Password<span class="auth-required">*</span></label>
            <input id="confirmPassword" name="confirmPassword" class="auth-input" type="password" />
          </div>
          <button type="submit" class="register-btn auth-btn auth-btn--primary">Register</button>
        </form>
        <p class="auth-footer">
          Already have an account? <a href="/login" class="auth-link">Login</a>
        </p>
      </div>
    </div>
  </main>
</div>
